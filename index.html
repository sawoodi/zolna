<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>زولنا | سوقنا يجمعنا</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f5f7f2;

      color: #183c2b;

    }

    header {

      background: #145c39;

      color: white;

      text-align: center;

      padding: 28px 15px;

    }

    header h1 {

      font-size: 38px;

      margin: 0;

    }

    header p {

      margin-bottom: 0;

      font-size: 18px;

    }

    nav {

      display: flex;

      justify-content: center;

      gap: 12px;

      padding: 15px;

      background: white;

    }

    nav a {

      color: #145c39;

      text-decoration: none;

      font-weight: bold;

    }

    main {

      max-width: 850px;

      margin: 30px auto;

      padding: 0 16px;

      text-align: center;

    }

    .welcome {

      background: white;

      padding: 28px 18px;

      border-radius: 16px;

    }

    .categories {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 15px;

      margin-top: 22px;

    }

    .category {

      background: white;

      padding: 24px 10px;

      border-radius: 14px;

      font-size: 20px;

      font-weight: bold;

    }

    .button {

      display: inline-block;

      margin-top: 20px;

      padding: 13px 24px;

      background: #d6a83d;

      color: #183c2b;

      border-radius: 9px;

      text-decoration: none;

      font-weight: bold;

    }

    footer {

      text-align: center;

      padding: 25px;

      color: #777;

    }

  </style>

</head>

<body>

  <header>

    <h1>زولنا</h1>

    <p>سوقنا.. يجمعنا</p>

  </header>

  <nav>

    <a href="#">الرئيسية</a>

    <a href="#categories">الأقسام</a>

    <a href="#contact">تواصل معنا</a>

  </nav>

  <main>

    <section class="welcome">

      <h2>مرحباً بيكم في زولنا</h2>

      <p>منصتكم السودانية للبيع والشراء بكل سهولة.</p>

      <a class="button" href="#categories">تصفح الإعلانات</a>

    </section>

    <section id="categories" class="categories">

      <div class="category">🏠 العقارات</div>

      <div class="category">🚗 السيارات</div>

    </section>

  </main>

  <footer id="contact">

    زولنا © 2026 — سوقنا يجمعنا

  </footer>

</body>

</html>
